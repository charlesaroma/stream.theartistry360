<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Films, shorts and replays from The Artistry360, Kampala." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Artistry360" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <title>Artistry360 Stream</title>
    <style>
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #000; transition: opacity 0.45s ease; }
      #splash.splash-out { opacity: 0; pointer-events: none; }
      #splash svg { width: 88px; height: 88px; overflow: visible; }
      #splash .o { transform-origin: 256px 256px; }
      #splash .r { fill: none; stroke: #f67d12; stroke-width: 30; stroke-linecap: round; }
      #splash .d, #splash .a { fill: #f67d12; }
      #splash .a { stroke: #f67d12; stroke-width: 6; stroke-linejoin: round; }
      #splash .p { fill: #faf7f2; stroke: #faf7f2; stroke-width: 8; stroke-linejoin: round; }
      #splash .d, #splash .p { transform-box: fill-box; transform-origin: center; }
      @media (prefers-reduced-motion: no-preference) {
        #splash[data-first] .r { stroke-dasharray: 1; stroke-dashoffset: 1; animation: splash-draw 0.8s cubic-bezier(0.65, 0, 0.35, 1) forwards; }
        #splash[data-first] .d { transform: scale(0); animation: splash-pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.7s forwards; }
        #splash[data-first] .a { opacity: 0; transform: translateY(60px); animation: splash-rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards; }
        #splash[data-first] .p { transform: scale(0); animation: splash-pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 0.55s forwards; }
        #splash:not([data-first]) .o { animation: splash-spin 1.1s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite; }
      }
      @keyframes splash-draw { to { stroke-dashoffset: 0; } }
      @keyframes splash-pop { to { transform: scale(1); } }
      @keyframes splash-rise { to { opacity: 1; transform: none; } }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <!-- Splash: shown until the app paints. Hidden by src/main.jsx. -->
    <div id="splash" role="status" aria-label="Loading The Artistry360">
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <g class="o"><path class="r" pathLength="1" d="M413.81 123.59 A206 206 0 1 1 263.19 50.13" /><circle class="d" cx="352.7" cy="74.1" r="21" /></g>
        <path class="a" d="M256 118 L374 384 L322 384 L256 235.2 L190 384 L138 384 Z" /><path class="p" d="M241 306 L241 366 L292 336 Z" />
      </svg>
    </div>
    <script>
      // The full draw-in plays on the first visit of a session only.
      try { if (!sessionStorage.getItem("a360-splash")) { document.getElementById("splash").setAttribute("data-first", ""); sessionStorage.setItem("a360-splash", "1"); } } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
